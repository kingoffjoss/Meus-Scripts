name: Pingo Android
on:
  push:
    branches: [main]
    paths: ['gotinha/android/**', '.github/workflows/pingo-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null || test -d "$ANDROID_HOME/platforms/android-35"
      - name: Test, lint and compile
        working-directory: gotinha/android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android overlay smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd gotinha/android && python3 smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingo-android-test-results
          path: |
            gotinha/android/app/build/reports/
            gotinha/android/smoke-results/
            gotinha/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp gotinha/android/app/build/outputs/apk/debug/app-debug.apk pingo-android-teste.apk
          if ! gh release view pingo-android-283.0-test >/dev/null 2>&1; then
            gh release create pingo-android-283.0-test --target "$GITHUB_SHA" --prerelease --title 'Pingo Android 283.0 · teste' --notes 'Mascote 3D flutuante para Android 8+. Instale o APK, abra Pingo flutuante, conceda a permissão de sobreposição e toque em Ativar. Build de teste com chave de depuração. IA abre no navegador. Não lê outros aplicativos. Validado por testes, lint e emulador Android 15; ainda requer teste em aparelhos reais.'
          fi
          gh release upload pingo-android-283.0-test pingo-android-teste.apk --clobber
